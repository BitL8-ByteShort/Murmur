name: Bug report
description: Report a problem with Murmur's public preview.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for trying the first public preview. Check existing issues before posting.
        Reports are public. Remove private dictated text from screenshots and clips.
        Bug reports do not require the contributor agreement.
  - type: input
    id: app_version
    attributes:
      label: App version and build
      description: Find this under Murmur → About Murmur.
      placeholder: "0.2.2 (build 4)"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Mac and macOS
      description: Include the Mac model, memory, macOS version, and display setup if relevant.
      placeholder: "MacBook Air M4, 16 GB RAM, macOS 26, built-in display plus external monitor"
    validations:
      required: true
  - type: dropdown
    id: playback
    attributes:
      label: Dictation mode or speech engine
      options:
        - Quick Talk
        - Keep Talking
        - Live microphone preview
        - Apple Speech
        - Moonshine Small
        - Parakeet Realtime
        - Whisper Turbo
        - Other / not sure
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the settings and actions that lead to the problem.
      placeholder: |
        1. Open a script…
        2. Choose…
        3. Start reading…
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include an error message if one appeared.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Screenshots or extra context
      description: Optional. Attach a screenshot or short clip after removing private dictated text.
